name: Verify Meetup archive
on:
  push:
    branches: [archive/meetup-2026-10-27]
  pull_request:
    paths:
      - 'src/**'
      - 'public/meetup-archive/**'
      - 'scripts/*meetup*'
      - '.github/workflows/meetup-archive.yml'
permissions:
  contents: read
concurrency:
  group: meetup-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Capture public Meetup source once
        if: github.event_name == 'push' && hashFiles('public/meetup-archive/source.json') == ''
        run: node scripts/capture-meetup-source.mjs
      - name: Preserve public Meetup images
        if: github.event_name == 'push'
        run: node scripts/capture-meetup-assets.mjs
      - run: node --test scripts/meetup-archive.test.mjs
      - run: npm run build
      - run: node scripts/check-meetup-build.mjs
      - run: node scripts/check-meetup-browser.mjs
      - name: Commit verified archive data and image bytes to this branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/meetup-archive/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve verified Meetup source and image assets'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meetup-archive-verification
          path: |
            dist/archive/meetup/
            dist/fr/archive/meetup/
            public/meetup-archive/
            test-results/meetup-archive/
          if-no-files-found: ignore
