name: Inspect public Meetup archive source
on:
  push:
    branches: [archive/meetup-2026-10-27]
    paths: [.github/workflows/meetup-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read public browser data
        run: |
          mkdir -p test-results/meetup-archive
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const results = [];
          for (const url of ['https://www.meetup.com/biere-code-beer-paris/', 'https://www.meetup.com/biere-code-beer-paris/events/315053424/']) {
            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              const result = await page.evaluate(() => {
                const raw = document.querySelector('#__NEXT_DATA__')?.textContent;
                const data = raw ? JSON.parse(raw) : null;
                const entities = [];
                const walk = (value, path = '') => {
                  if (!value || typeof value !== 'object') return;
                  if (value.__typename && /^(Event|Group|Venue|Photo|PhotoAlbum)$/.test(value.__typename)) {
                    const clean = Object.fromEntries(Object.entries(value).filter(([key]) => !/member|attendee|rsvp|going|waiting/i.test(key) || /count/i.test(key)));
                    entities.push({ path, value: clean });
                    return;
                  }
                  for (const [key, item] of Object.entries(value)) if (!/member|attendee/i.test(key)) walk(item, `${path}.${key}`);
                };
                walk(data);
                return { title: document.title, pagePropsKeys: Object.keys(data?.props?.pageProps || {}), entities, jsonLd: [...document.querySelectorAll('script[type="application/ld+json"]')].map((s) => { try { return JSON.parse(s.textContent); } catch { return s.textContent; } }) };
              });
              results.push({ url, status: response?.status(), ...result });
            } catch (error) { results.push({ url, error: String(error) }); }
          }
          await browser.close();
          console.log(JSON.stringify(results));
          await writeFile('test-results/meetup-archive/source-inspection.json', JSON.stringify(results, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meetup-source-inspection
          path: test-results/meetup-archive/source-inspection.json
